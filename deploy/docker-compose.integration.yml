version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: chess404_test
    ports:
      - 5432:5432
    healthcheck:
      test: pg_isready -U test
      interval: 2s
      timeout: 2s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    healthcheck:
      test: redis-cli ping
      interval: 2s
      timeout: 2s
      retries: 10

  # Opt-in only (docker compose --profile tools run integration-runner):
  # a bare `docker compose up -d --wait` -- what CI and the documented local
  # dev flow both actually use -- must start ONLY postgres+redis. This
  # container runs `go test` to completion and exits; if it were in the
  # default profile, `--wait` could observe that exit during startup and
  # report the whole command as failed even though postgres/redis came up
  # fine and the real go-integration CI step (a separate step, running go
  # test directly on the runner) never touches this container at all.
  integration-runner:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.integration
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TEST_POSTGRES_URL: postgres://test:test@postgres:5432/chess404_test?sslmode=disable
      TEST_REDIS_URL: redis://redis:6379/0
