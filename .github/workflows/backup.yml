# Scheduled Postgres backups via deploy/postgres-backup.sh.
#
# No-ops with a clear notice until these repository secrets are configured:
#   BACKUP_DATABASE_URL          — Postgres connection string (pg_dump target)
#   BACKUP_AWS_S3_BUCKET         — S3-compatible bucket for uploads
#   BACKUP_AWS_ACCESS_KEY_ID     — upload credentials
#   BACKUP_AWS_SECRET_ACCESS_KEY
#   BACKUP_AWS_REGION            — optional, defaults to us-east-1
#
# The runner's disk is ephemeral: without the S3 secrets there is nothing
# to keep, so the job exits early instead of producing a throwaway dump.
# Railway's dashboard PITR remains the recommended primary backup mechanism
# (see docs/launch-audit/rollback-procedure.md and CLAUDE.md); this workflow
# is the stopgap that does not depend on Railway cron.
name: postgres-backup

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch: {}

concurrency:
  group: postgres-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      AWS_S3_BUCKET: ${{ secrets.BACKUP_AWS_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.BACKUP_AWS_REGION || 'us-east-1' }}
      # S3-compatible endpoints (Cloudflare R2, Backblaze B2, MinIO...): AWS CLI
      # v2 reads AWS_ENDPOINT_URL automatically. Leave unset for real AWS.
      AWS_ENDPOINT_URL: ${{ secrets.BACKUP_AWS_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip unless backup target is configured
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$AWS_S3_BUCKET" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::notice::postgres-backup is not configured. Set the BACKUP_* repository secrets to enable daily dumps. Skipping."
            exit 0
          fi

      - name: Install pg_dump matching the server major (Postgres 18)
        run: |
          # ubuntu-latest ships postgresql-client 16, but the Railway Postgres
          # server is 18.x and pg_dump refuses cross-major dumps ("server
          # version mismatch"). Install the PGDG client for the server's major
          # and put it first on PATH. When Railway bumps the server major,
          # bump the package and the /usr/lib path below; the failure mode is
          # an explicit pg_dump version-mismatch error.
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Dump and upload
        run: |
          chmod +x deploy/postgres-backup.sh
          ./deploy/postgres-backup.sh
        # The script's local-dir prune is meaningless on an ephemeral runner;
        # keep retention by setting a lifecycle rule on the bucket (or
        # extend the script to list/delete remote objects).
