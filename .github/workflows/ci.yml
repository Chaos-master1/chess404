name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/realtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/realtime/go.sum
      - run: go vet ./...

  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/realtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/realtime/go.sum
      - run: go test ./internal/... ./cmd/... -v -count=1 -timeout 300s

  go-race:
    # The plain go-test job cannot see data races: -race builds fail only
    # where the scheduler actually interleaves the racy goroutines. This job
    # reruns the suite under the race detector (slower, ~10x on the hot
    # packages) so lock-discipline regressions like the GC broadcast race are
    # caught in CI, not by a process crash in production.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/realtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/realtime/go.sum
      - run: go test -race ./internal/... ./cmd/... -count=1 -timeout 900s

  go-vuln:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/realtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/realtime/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run vulnerability scan
        run: govulncheck ./...

  go-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/realtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/realtime/go.sum
      - run: go build ./...

  go-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/realtime/go.sum
      # No job-level working-directory default here (unlike the other Go
      # jobs): docker-compose.integration.yml's `context: .` build context
      # must resolve to the repo root, matching every other Dockerfile's
      # build context in this workflow (see docker-build below). Running
      # this under services/realtime (as this job did before) resolved the
      # compose file path to services/realtime/deploy/..., which doesn't
      # exist -- one of three independent reasons this job never actually
      # ran (the others: internal/integration didn't exist as a package at
      # all, and Dockerfile.integration didn't exist either).
      - name: Start test infrastructure
        run: docker compose -f deploy/docker-compose.integration.yml up -d --wait
      - name: Run integration tests
        working-directory: services/realtime
        run: go test ./internal/integration/... -v -count=1 -timeout 300s -tags=integration
        env:
          TEST_POSTGRES_URL: postgres://test:test@localhost:5432/chess404_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/0
      - name: Cleanup
        if: always()
        run: docker compose -f deploy/docker-compose.integration.yml down -v

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - gateway
          - match-service
          - platform-service
          - matchmaking-service
          - analysis-worker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.service }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.service }}-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/railway/${{ matrix.service == 'analysis-worker' && 'Dockerfile.analysis-worker' || format('{0}.Dockerfile', matrix.service) }}
          push: false
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

  web-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && pnpm install
      - run: pnpm run lint

  packages-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && pnpm install
      - run: pnpm --filter @chess404/contracts run lint
      - run: pnpm --filter @chess404/game-core run lint
      # The Go server embeds its own copy of the shared card catalog. Fail
      # fast here if the generated copies have drifted, before the client is
      # built against a catalog the server never sees.
      - run: node packages/game-core/scripts/sync-cards-json.mjs
      - run: git diff --exit-code services/realtime/internal/match/cards.json

  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && pnpm install
      # Runs lint-types (next typegen + tsc) and the vitest unit suite.
      - run: pnpm test

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && pnpm install
      - run: pnpm run build
